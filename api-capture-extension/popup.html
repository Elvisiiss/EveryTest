<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 420px; margin: 0; padding: 12px; font: 13px/1.5 "Microsoft YaHei", sans-serif; color: #222; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  label { display: block; margin-bottom: 6px; color: #555; }
  input[type=text], input[type=number] { width: 100%; box-sizing: border-box; padding: 5px 8px; border: 1px solid #ccc; border-radius: 4px; }
  .row { display: flex; gap: 8px; margin: 10px 0; }
  button { flex: 1; padding: 6px 0; border: 1px solid #999; border-radius: 4px; background: #f5f5f5; cursor: pointer; }
  button:hover { background: #e8e8e8; }
  .hint { color: #888; font-size: 12px; }
  #log { margin-top: 10px; max-height: 240px; overflow-y: auto; background: #1e1e1e; color: #d4d4d4; border-radius: 6px; padding: 8px; font: 12px/1.6 Consolas, monospace; white-space: pre-wrap; word-break: break-all; }
  .ok { color: #4ec9b0; }
  .warn { color: #dcdcaa; }
  .error { color: #f48771; }
</style>
</head>
<body>
  <h1>API 抓取工具（临时）</h1>
  <label><input type="checkbox" id="enabled" checked> 启用监听（检测到匹配请求后自动执行三步流程并导出 xlsx）</label>
  <label>URL 匹配正则（默认匹配所有 .txt 结尾的请求）
    <input type="text" id="pattern" value="\.txt(\?|$)">
  </label>
  <label>翻页参数名（逗号分隔）
    <input type="text" id="pageKeys" value="page,pageNum,pageNo,pageIndex,currentPage,current,p,offset,start,pageId">
  </label>
  <label>最大翻页数
    <input type="number" id="maxPages" value="200" min="1">
  </label>
  <div class="row">
    <button id="save">保存配置</button>
    <button id="clear">清空日志</button>
  </div>
  <div class="hint">xlsx 自动保存到下载目录的 api-capture/ 子文件夹。Cookie 与 Authorization 会随请求自动携带。</div>
  <div id="log"></div>
  <script src="popup.js"></script>
</body>
</html>
